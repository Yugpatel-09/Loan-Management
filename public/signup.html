<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Registration | Mangukiya Reserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#baeddd",
                        "primary-fixed": "#baeddc",
                        "background": "#0A0A0A",
                        "surface": "#121212",
                        "on-surface": "#f5f3f2",
                        "on-surface-variant": "#a3aaa6",
                    },
                    fontFamily: {
                        "serif": ["Playfair Display"],
                        "sans": ["Manrope"],
                        "mono": ["JetBrains Mono"]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #f5f3f2; -webkit-font-smoothing: antialiased; }
        .glass-panel {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #errorMsg { display: none; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col relative overflow-hidden">
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-primary-fixed/5 rounded-full blur-[120px] opacity-50"></div>
    </div>

    <nav class="w-full z-50 flex justify-center items-center py-8 absolute top-0">
        <a href="index.html" class="flex items-center gap-4 group">
            <svg class="w-8 h-8 text-primary-fixed group-hover:rotate-180 transition-transform duration-700" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0ZM12 14C13.1046 14 14 13.1046 14 12C14 10.8954 13.1046 10 12 10C10.8954 10 10 10.8954 10 12C10 13.1046 10.8954 14 12 14Z" />
            </svg>
            <span class="text-xl font-serif tracking-widest uppercase">Mangukiya Reserve</span>
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6 z-10 mt-16 mb-16">
        <div class="glass-panel w-full max-w-md p-10 lg:p-12 shadow-2xl relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-fixed to-transparent opacity-50"></div>

            <div class="text-center mb-10">
                <h1 class="text-3xl font-serif mb-3">Client Application</h1>
                <p class="text-on-surface-variant text-sm tracking-widest uppercase opacity-70">New Portfolio Registration</p>
            </div>

            <div id="errorMsg" class="mb-4 px-4 py-3 bg-red-900/40 border border-red-500/30 text-red-300 text-sm rounded"></div>

            <form id="signupForm" action="javascript:void(0);" class="flex flex-col gap-5">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-on-surface-variant mb-2">Full Name</label>
                    <input type="text" id="full_name" required class="w-full bg-black/50 border border-white/10 px-4 py-3 text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-white/20" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-on-surface-variant mb-2">Phone Number</label>
                    <input type="tel" id="phone_number" required class="w-full bg-black/50 border border-white/10 px-4 py-3 text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-white/20" placeholder="+91 98765 43210">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-on-surface-variant mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-black/50 border border-white/10 px-4 py-3 text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-white/20" placeholder="client@example.com">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-on-surface-variant mb-2">Create Password</label>
                    <div class="relative">
                        <input type="password" id="password" required minlength="6" class="w-full bg-black/50 border border-white/10 px-4 py-3 pr-12 text-on-surface focus:outline-none focus:border-primary-fixed transition-colors placeholder:text-white/20" placeholder="••••••••">
                        <button type="button" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle Password Visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-fixed transition-colors p-1 flex items-center justify-center">
                            <span class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-start gap-3 mt-2">
                    <input type="checkbox" required id="terms" class="w-4 h-4 mt-0.5 rounded-sm bg-black/50 border-white/10 text-primary-fixed focus:ring-primary-fixed focus:ring-offset-0">
                    <label for="terms" class="text-xs text-on-surface-variant leading-relaxed">I agree to the Institutional Terms, Disclosures, and Privacy Policy.</label>
                </div>
                <button type="submit" id="signupButton" class="w-full mt-4 bg-primary-fixed text-[#00382d] font-bold tracking-[0.2em] text-sm py-4 hover:bg-white transition-colors duration-300">
                    SUBMIT APPLICATION
                </button>
            </form>

            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <p class="text-xs text-on-surface-variant mb-4">Already have an account? <a href="login.html" class="text-primary-fixed hover:underline">Sign In</a></p>
                <p class="text-[10px] text-on-surface-variant opacity-60">Protected by bank-grade encryption.</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9O7L2x_10DD0XfUSrJIwoKr1WunvxOpM",
            authDomain: "loan-management-5dcd1.firebaseapp.com",
            projectId: "loan-management-5dcd1",
            storageBucket: "loan-management-5dcd1.firebasestorage.app",
            messagingSenderId: "772887985088",
            appId: "1:772887985088:web:d3e533d6b0974c9be36625",
            measurementId: "G-1QWKNZZRT4"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Wraps a promise with a timeout — Firebase hangs if domain is not whitelisted
        function withTimeout(promise, ms) {
            const timeout = new Promise((_, reject) =>
                setTimeout(() => reject({ code: 'auth/timeout' }), ms)
            );
            return Promise.race([promise, timeout]);
        }

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();

            const full_name = document.getElementById('full_name').value.trim();
            const phone_number = document.getElementById('phone_number').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const button = document.getElementById('signupButton');

            if (!full_name || !phone_number || !email || !password) {
                showError('Please fill in all fields.');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            button.textContent = 'SUBMITTING...';
            button.disabled = true;

            try {
                // 10s timeout — Firebase silently hangs when domain isn't whitelisted
                const credential = await withTimeout(
                    auth.createUserWithEmailAndPassword(email, password),
                    10000
                );
                const user = credential.user;

                // Update display name (non-blocking)
                await user.updateProfile({ displayName: full_name }).catch(() => {});

                // Save to Firestore (await write so navigation doesn't cancel request)
                try {
                    await db.collection('users').doc(user.uid).set({
                        full_name, phone_number, email, password, role: 'client',
                        created_at: firebase.firestore.FieldValue.serverTimestamp(),
                        last_login: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (fsErr) {
                    console.warn('Firestore user save warning:', fsErr);
                }

                // Sign out so user MUST log in manually
                await auth.signOut().catch(() => {});
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userName');

                // Redirect to login page with success status
                window.location.href = 'login.html?signup=success&email=' + encodeURIComponent(email);

            } catch (err) {
                button.textContent = 'SUBMIT APPLICATION';
                button.disabled = false;

                if (err.code === 'auth/timeout') {
                    showError('⚠️ Connection timed out. Your Vercel domain needs to be whitelisted in Firebase. Go to: Firebase Console → Authentication → Settings → Authorized Domains → Add "' + location.hostname + '"');
                } else if (err.code === 'auth/email-already-in-use') {
                    showError('This email is already registered. Please sign in instead.');
                } else if (err.code === 'auth/invalid-email') {
                    showError('Please enter a valid email address.');
                } else if (err.code === 'auth/weak-password') {
                    showError('Password must be at least 6 characters.');
                } else if (err.code === 'auth/network-request-failed') {
                    showError('Network error. Please check your connection and try again.');
                } else {
                    showError('Error (' + (err.code || 'unknown') + '): ' + (err.message || 'Registration failed'));
                }
            }
        });
    </script>
</body>
</html>
